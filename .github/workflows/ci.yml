name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-train:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest
      - name: Train models and generate EDA
        run: |
          python -m src.data
          python -m src.eda
          python -m src.train
      - name: Upload training outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-outputs-python-${{ matrix.python-version }}
          path: |
            artifacts/
            data/processed/heart_disease.csv
            models/heart_disease.joblib
            mlflow.db
            mlartifacts/
          if-no-files-found: warn
