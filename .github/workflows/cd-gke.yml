name: CD - GKE

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.GKE_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: gke-production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Authenticate to Google Cloud with Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ vars.GKE_CLUSTER }}
          location: ${{ vars.GKE_LOCATION }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Build and push the tested commit image
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_ARTIFACT_REGION: ${{ vars.GCP_ARTIFACT_REGION }}
          GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
        run: |
          set -euo pipefail
          : "${GCP_PROJECT_ID:?Set the GCP_PROJECT_ID environment variable}"
          : "${GCP_ARTIFACT_REGION:?Set the GCP_ARTIFACT_REGION environment variable}"
          : "${GCP_ARTIFACT_REPOSITORY:?Set the GCP_ARTIFACT_REPOSITORY environment variable}"
          image="${GCP_ARTIFACT_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${GCP_ARTIFACT_REPOSITORY}/heart-disease-api:${GITHUB_SHA}"
          gcloud auth configure-docker "${GCP_ARTIFACT_REGION}-docker.pkg.dev" --quiet
          docker build --pull --tag "$image" .
          docker push "$image"
          echo "IMAGE=$image" >> "$GITHUB_ENV"

      - name: Deploy API to GKE
        run: |
          set -euo pipefail
          kubectl kustomize k8s/gke \
            | python -c 'import sys; manifest = sys.stdin.read(); old = "image: heart-disease-api:local"; assert manifest.count(old) == 1, "Expected exactly one local API image reference"; sys.stdout.write(manifest.replace(old, "image: " + sys.argv[1]))' "$IMAGE" \
            | kubectl apply -f -
          kubectl rollout status deployment/heart-disease-api \
            --namespace heart-disease-mlops --timeout=300s

      - name: Verify public API and report its URL
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            address="$(kubectl get service heart-disease-api \
              --namespace heart-disease-mlops \
              --output jsonpath='{.status.loadBalancer.ingress[0].ip}')"
            if [ -n "$address" ]; then
              break
            fi
            sleep 10
          done
          if [ -z "${address:-}" ]; then
            echo "GKE did not assign an external IP within 10 minutes." >&2
            exit 1
          fi
          url="http://${address}"
          curl --fail --silent --show-error --retry 12 --retry-connrefused \
            --retry-delay 10 "${url}/health"
          echo "Public API URL: ${url}"
          echo "Health endpoint: ${url}/health"
          echo "API documentation: ${url}/docs"
