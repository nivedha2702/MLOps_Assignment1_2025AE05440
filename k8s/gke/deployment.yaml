apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-disease-api
  labels:
    app.kubernetes.io/name: heart-disease-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: heart-disease-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: heart-disease-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: heart-disease-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LOG_LEVEL
              value: INFO
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api
  labels:
    app.kubernetes.io/name: heart-disease-api
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: heart-disease-api
  ports:
    - name: http
      port: 80
      targetPort: http
