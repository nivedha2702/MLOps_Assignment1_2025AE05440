apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: heart-disease-api-deployer
  namespace: heart-disease-mlops
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: heart-disease-api-deployer
  namespace: heart-disease-mlops
subjects:
  - kind: User
    name: REPLACE_WITH_GCP_DEPLOY_SERVICE_ACCOUNT_EMAIL
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: heart-disease-api-deployer
  apiGroup: rbac.authorization.k8s.io
